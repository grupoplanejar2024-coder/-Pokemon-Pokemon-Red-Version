<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon: Red Version - Kubo Touch</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100%; 
            background-color: #121212; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
        }
        
        header { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            padding: 15px; 
            background: #1e1e1e; 
            z-index: 5; 
        }
        
        .badge { 
            background: #333333; 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
            border: 1px solid #555; 
        }
        
        #game-card { 
            width: 100%;
            max-width: 440px; 
            margin: 80px 20px 20px 20px; 
            background: #1e1e1e; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            perspective: 1000px;
        }
        
        /* Container 3D Interativo */
        .cartridge-wrapper {
            width: 100%;
            padding: 25px 10px 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        /* Cartucho Game Boy Vermelho */
        .gb-cart-body {
            width: 240px;
            height: 274px;
            position: relative;
            background: linear-gradient(180deg, #e02424 0%, #b51515 100%);
            border-radius: 8px 6px 6px 6px;
            clip-path: polygon(0 0, calc(100% - 22px) 0, calc(100% - 22px) 16px, 100% 16px, 100% 100%, 0 100%);
            box-shadow: 
                inset 0 2px 3px rgba(255,150,150,0.45),
                inset 0 -4px 7px rgba(60,0,0,0.48),
                inset 3px 0 4px rgba(255,130,130,0.25),
                inset -3px 0 4px rgba(60,0,0,0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 10px 0;
            transform: translateZ(20px);
            filter: drop-shadow(0 15px 22px rgba(0,0,0,0.75));
        }

        /* Faixa superior com logotipo em relevo */
        .gb-top-band {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gb-logo-oval {
            width: 100%;
            height: 36px;
            background: linear-gradient(180deg, #c21818 0%, #d42020 100%);
            border-radius: 18px;
            box-shadow: 
                inset 0 2px 4px rgba(55,0,0,0.5),
                0 1px 1px rgba(255,160,160,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gb-logo-text {
            font-size: 11px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.4px;
            color: #961010;
            text-shadow: 0 1px 0 rgba(255,140,140,0.35), 0 -1px 0 rgba(50,0,0,0.45);
            white-space: nowrap;
        }

        .gb-logo-text small {
            font-style: normal;
            font-size: 7px;
            font-weight: 800;
            margin-left: 2px;
        }

        /* Cavidade central do adesivo (Label) */
        .gb-label-recess {
            width: 184px;
            height: 164px;
            margin-top: 12px;
            padding: 3px;
            background: #9c1212;
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(45,0,0,0.6), 0 1px 1px rgba(255,150,150,0.3);
            display: flex;
        }

        .gb-label-sticker {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            background: #c92a2a;
            border: 1px solid #3a0808;
        }

        /* Capa do jogo diminuída e enquadrada no adesivo igual ao modelo */
        .gb-sticker-art {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #c92a2a;
            overflow: hidden;
        }

        .gb-sticker-art img {
            width: 122%;
            height: 100%;
            max-width: none;
            object-fit: cover;
            object-position: right center;
            transform: translateX(-18%) translateZ(0);
            image-rendering: -webkit-optimize-contrast;
            filter: contrast(1.04) saturate(1.06);
            backface-visibility: hidden;
            will-change: transform;
            display: block;
        }

        /* Reflexo sutil no adesivo ao passar o mouse / tocar */
        .gb-label-sticker::after {
            content: '';
            position: absolute;
            top: 0; left: -120%;
            width: 65%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            z-index: 3;
            pointer-events: none;
        }

        .gb-cart-body:hover .gb-label-sticker::after {
            left: 160%;
        }

        /* Triângulo inferior do cartucho */
        .gb-bottom-triangle {
            margin-top: 8px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid #a81313;
            filter: drop-shadow(0 1px 0 rgba(255,150,150,0.3));
        }

        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 22px; color: #e5e5e5; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        
        .btn-play { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            background: #2b2b2b; 
            color: #fff; 
            border: 1px solid #555; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
            text-align: center; 
            outline: none;
            position: relative;
            z-index: 10;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-play:hover { background: #3b3b3b; transform: translateY(-2px); }
        .btn-play:active { background: #1f1f1f; transform: translateY(0); }

        #game-container { 
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 99999;
            background: #000;
        }
        #game { width: 100%; height: 100%; }

        /* Responsividade para telas de celulares menores */
        @media (max-width: 400px) {
            .gb-cart-body {
                transform: scale(0.9) translateZ(20px);
            }
        }
    </style>
</head>
<body>

    <header id="header-bar">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <!-- Cartucho Game Boy 3D -->
        <div class="cartridge-wrapper" id="cartridge3d">
            <div class="gb-cart-body">
                <!-- Topo com logotipo em relevo -->
                <div class="gb-top-band">
                    <div class="gb-logo-oval">
                        <span class="gb-logo-text">Nintendo GAME BOY<small>TM</small></span>
                    </div>
                </div>

                <!-- Cavidade e Adesivo do Cartucho -->
                <div class="gb-label-recess">
                    <div class="gb-label-sticker">
                        <div class="gb-sticker-art">
                            <img src="pokemon_red_version_game_boy_hq_box_art_by_jadelune_d9tkrbj-pre.jpg" alt="Capa Pokémon: Red Version">
                        </div>
                    </div>
                </div>

                <!-- Triângulo inferior do cartucho -->
                <div class="gb-bottom-triangle"></div>
            </div>
        </div>
        
        <div class="content">
            <h1>Pokémon: Red Version</h1>
            
            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1996 / 1998</span>
                <span>🕹️ Nintendo (GB)</span>
            </div>

            <p class="description">
                Comece sua jornada pela região de Kanto escolhendo entre Bulbasaur, Charmander ou Squirtle, desafie os oito ginásios e enfrente a Liga Pokémon para se tornar Campeão.
            </p>

            <div class="details">
                <ul>
                    <li><strong>🕹️ Gênero:</strong> RPG / Aventura</li>
                </ul>
            </div>

            <button id="play-btn" class="btn-play">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // Efeito 3D interativo
        const card = document.getElementById('game-card');
        const cartridge = document.getElementById('cartridge3d');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const rotateX = (-y / 14).toFixed(2);
            const rotateY = (x / 14).toFixed(2);
            
            cartridge.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
        });

        card.addEventListener('mouseleave', () => {
            cartridge.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            cartridge.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            cartridge.style.transition = 'none';
        });

        // Inicialização do Emulador
        document.getElementById('play-btn').addEventListener('click', function() {
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('game-card').style.display = 'none';
            
            var container = document.getElementById('game-container');
            container.style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = 'gb';
            window.EJS_gameName = "Pokemon - Red Version";
            window.EJS_color = '#c92a2a';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = 'Pokemon%20-%20Red%20Version%20%28USA%2C%20Europe%29%20%28SGB%20Enhanced%29.gb';

            var script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.async = true;
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
